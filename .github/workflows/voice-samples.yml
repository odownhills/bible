name: Arabic voice samples (trial)

# A trial on this branch only: short samples of the Arabic read in a plain speaking voice, for Obay to
# choose from (scripts/voice_samples.py). Not part of the site.
on:
  push:
    branches: [claude/project-thread-t95ud5]
    paths: ["scripts/voice_samples.py", ".github/workflows/voice-samples.yml"]

jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          command -v aws >/dev/null || python3 -m pip install --quiet --break-system-packages awscli
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python3 scripts/voice_samples.py
