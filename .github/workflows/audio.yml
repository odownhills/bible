name: Record chapter audio

# Records Gemini voice audio for chapters that have text but no recording yet, checks each new
# recording word for word against the chapter (a mismatch is thrown away and retried), works out when
# each word is spoken (for Listen + Read mode). Recordings go to the Cloudflare R2 bucket (see
# scripts/media.py); only the small files (word timings, data/audio.json) are committed.
# The same steps then run for the Quran site (WORK=quran, built into site-quran/): Bible chapters
# are recorded first, and the Quran's parts with whatever is left of Gemini's daily limit. The site shows
# each surah as one page, so each surah's recorded parts are then joined into one recording.
on:
  push:
    branches: [main]
    paths: ["translations/**", "scripts/media.py", "scripts/quran_join.py"]
  schedule:
    - cron: "17 8 * * *"    # 12:17 AM Pacific, just after Gemini's free daily limit resets
    - cron: "23 14 * * *"   # daily catch-up, 6:23 AM Pacific
  workflow_dispatch:
    inputs:
      max:
        description: "How many chapters to record in this run"
        default: "10"

permissions:
  contents: write

concurrency:
  group: audio
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the R2 secrets
        id: r2
        run: |
          if [ -z "$R2_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::Add the R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_ENDPOINT repository secrets (see scripts/media.py)."
            exit 1
          fi
          command -v aws >/dev/null || python3 -m pip install --quiet --break-system-packages awscli
      - name: Move recordings still in git to R2
        run: python3 scripts/media.py migrate
      - name: Record
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_CHAPTERS: ${{ inputs.max }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "No GEMINI_API_KEY secret yet; nothing to do."; exit 0; fi
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet --break-system-packages sherpa-onnx numpy || echo "Could not install the listener; recordings will not be checked."
          for work in bible quran; do
            export WORK=$work
            python3 scripts/build.py
            python3 scripts/tts.py --max "${MAX_CHAPTERS:-10}" --strict
            python3 scripts/build.py
          done
      - name: Time the words for Listen + Read
        if: always() && steps.r2.outcome == 'success'
        run: |
          for work in bible quran; do
            export WORK=$work
            python3 scripts/build.py
            if [ "$(python3 scripts/align.py --pending)" = "0" ]; then echo "Word timings are up to date ($work)."; continue; fi
            command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
            python3 -m pip install --quiet --break-system-packages sherpa-onnx numpy
            python3 scripts/align.py
          done
      - name: Join each surah's parts into one recording (Quran)
        if: always() && steps.r2.outcome == 'success'
        run: |
          export WORK=quran
          python3 scripts/build.py
          command -v ffmpeg >/dev/null || sudo apt-get install -y -qq ffmpeg
          python3 scripts/quran_join.py
      - name: Publish
        if: always() && steps.r2.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-files site site-quran | grep -q '\.mp3$'; then echo "::error::A recording is about to be committed to git."; exit 1; fi
          # builds both sites, commits, and starts again from main's newest commit if a push was first
          python3 scripts/media.py push "Add chapter audio"
