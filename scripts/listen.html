<style>
.player{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:1.25rem 1.1rem 1.1rem;font-family:var(--sans);margin-top:.5rem}
.np-label{color:var(--text-soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;text-align:center}
.np-title{font-family:var(--serif);color:var(--heading);font-size:1.9rem;line-height:1.2;text-align:center;margin:.25rem 0 0}
.np-sub{color:var(--text-soft);font-size:.8rem;text-align:center;min-height:1.3em;margin:.2rem 0 1rem}
.transport{display:flex;align-items:center;justify-content:space-between;margin:1rem 0 .9rem}
.note-line{font-size:.78rem;color:var(--text-soft);text-align:center;margin:.9rem 0 0}
.note-line[hidden]{display:none}
.chip.fam[aria-pressed="false"]{color:var(--text-soft)}
.chip[hidden]{display:none}
.lib{margin-top:1.75rem;font-family:var(--sans)}
.lib-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;border-bottom:1px solid var(--rule);padding-bottom:.5rem;margin-bottom:.4rem}
.lib-head h2{font-size:.8rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin:0}
.lib-head select{font:inherit;font-size:.9rem;color:var(--text);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:.45rem .6rem;max-width:60%}
.rows{list-style:none;margin:0;padding:0}
.rows button{width:100%;display:flex;align-items:center;gap:.75rem;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--text);font:inherit;font-size:1rem;text-align:left;padding:.85rem .25rem;cursor:pointer;min-height:52px}
.rows button:active{background:var(--panel)}
.rows .ix{width:1.6rem;color:var(--num);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rows .nm{flex:1;min-width:0}
.rows .du{color:var(--text-soft);font-size:.82rem;font-variant-numeric:tabular-nums;flex:none}
.rows .cur .nm{color:var(--accent);font-weight:600}
.rows .cur .ix{color:var(--accent)}
.rows .done .nm{color:var(--text-soft)}
.rows .bar{display:block;height:3px;border-radius:2px;background:var(--rule);margin-top:.3rem;overflow:hidden}
.rows .bar i{display:block;height:100%;background:var(--accent)}
</style>
<div class="player">
  <div class="np-label">Now playing</div>
  <h1 class="np-title" id="title">&hellip;</h1>
  <p class="np-sub" id="sub"></p>
  <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Position in chapter">
  <div class="times"><span id="tcur">0:00</span><span id="trem">0:00</span></div>
  <div class="transport">
    <button class="tb" id="prev" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path class="solid" d="M7 6v12H5V6zM19 6.5v11a.5.5 0 0 1-.8.4L10 12l8.200-5.900a.5.5 0 0 1 .8.400z"/></svg></button>
    <button class="tb skip" id="back" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.600-5.900"/><path d="M3.500 3.500v3.500H7"/></svg><span>15</span></button>
    <button class="tb main" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="ico"><path class="solid" d="M8 5.200v13.600a.6.6 0 0 0 .900.500l11-6.800a.6.6 0 0 0 0-1L8.900 4.700a.6.6 0 0 0-.900.500z"/></svg></button>
    <button class="tb skip" id="fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.600-5.900"/><path d="M20.500 3.500v3.500H17"/></svg><span>30</span></button>
    <button class="tb" id="next" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path class="solid" d="M17 6v12h2V6zM5 6.500v11a.5.5 0 0 0 .8.400L14 12 5.800 6.100a.5.5 0 0 0-.8.400z"/></svg></button>
  </div>
  <div class="chips">
    <select class="chip" id="rate" aria-label="Speed">
      <option value="0.8">0.8&times; speed</option><option value="0.9">0.9&times; speed</option><option value="1" selected>1&times; speed</option>
      <option value="1.1">1.1&times; speed</option><option value="1.25">1.25&times; speed</option><option value="1.5">1.5&times; speed</option>
      <option value="1.75">1.75&times; speed</option><option value="2">2&times; speed</option>
    </select>
    <select class="chip" id="sleep" aria-label="Sleep timer">
      <option value="0" selected>Timer off</option><option value="15">Stop in 15 min</option><option value="30">Stop in 30 min</option>
      <option value="60">Stop in 60 min</option><option value="end">Stop after chapter</option>
    </select>
    <button class="chip fam" id="fam" type="button" aria-pressed="false" hidden>Family lists: off</button>
    <a class="chip" id="read" href="#">Read along</a>
  </div>
  <p class="note-line" id="note" hidden></p>
</div>
<div class="lib">
  <div class="lib-head"><h2>Chapters</h2><select id="book" aria-label="Book"></select></div>
  <ul class="rows" id="rows"></ul>
</div>
<audio id="audio" preload="auto"></audio>
<audio id="say" preload="auto"></audio>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var audio=$('audio'),seek=$('seek'),synth=window.speechSynthesis;
var list=[],i=0,busy=false,fails=0,want=false,mode='audio',dragging=false,sents=[],si=0,sleepT=null,stopAtEnd=false,lastSave=0;
var PLAY='<path class="solid" d="M8 5.200v13.600a.6.6 0 0 0 .900.500l11-6.800a.6.6 0 0 0 0-1L8.900 4.700a.6.6 0 0 0-.900.500z"/>';
var PAUSE='<path class="solid" d="M7 5h3.500v14H7zM13.500 5H17v14h-3.500z"/>';
function get(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var pos=get('listenPos',{}),done=get('listenDone',{});
/* Story only (Obay, 2026-11-28): the family lists marked in data/family_lists.json (runs of verses that are only names
   and ages) are skipped, with a short spoken notice: "Skipping 6 verses of family names." A chapter that is a family
   list from start to end is skipped whole, even when it is chosen ("Skipping Genesis chapter 36, a list of family
   names."). The "Family lists" switch plays everything. Listen + Read on the chapter pages always reads every verse.
   The times come from the manifest (scripts/build.py); the notices are recorded by scripts/notices.py, and until one
   is, the phone's own voice says it. */
var sayEl=$('say'),N={busy:false,n:0,t:0,unlocked:false},famT=0;
var SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
function lists(){ return !!get('familyLists',false); }   // true: the family lists play too
function wholeSkip(c){ return !!(c&&c.familyAll&&!lists()); }
function famOf(c){ return c&&c.family&&!lists()&&mode==='audio'?c.family:null; }
function unlock(){   // inside a tap: lets the notice play later, when the phone is in a pocket
  if(N.unlocked||N.busy)return; N.unlocked=true;
  try{ sayEl.src=SILENT; var p=sayEl.play(); if(p&&p.catch) p.catch(function(){}); }catch(e){}
}
function say(item,then){
  // the notice in the chapters' own voice, else the phone's voice; never more than 9 seconds
  var mine=++N.n,fin=false,spoke=false; N.busy=true; clearTimeout(N.t);
  function end(){ if(fin||mine!==N.n)return; fin=true; clearTimeout(N.t); N.busy=false; then(); }
  function speak(){
    if(spoke||fin||mine!==N.n)return; spoke=true;
    if(!synth||!window.SpeechSynthesisUtterance){ N.t=setTimeout(end,600); return; }
    try{ synth.cancel(); var u=new SpeechSynthesisUtterance(item.say); u.rate=Math.min(rate(),1.5); u.onend=u.onerror=end; synth.speak(u); }catch(e){ end(); }
  }
  N.t=setTimeout(end,9000);
  if(item.clip){
    sayEl.onended=end; sayEl.onerror=speak; sayEl.src='../'+item.clip; sayEl.playbackRate=rate();
    try{ var p=sayEl.play(); if(p&&p.catch) p.catch(speak); }catch(e){ speak(); }
  }else speak();
}
function hush(){ N.n++; N.busy=false; clearTimeout(N.t); try{ sayEl.pause(); }catch(e){} if(synth&&mode==='audio') try{ synth.cancel(); }catch(e){} }
function hint(){
  if(get('familyHint',false))return; put('familyHint',true);
  var n=$('note'); n.hidden=false; n.textContent='Family lists are skipped. Turn on Family lists to hear every name.';
}
function famBtn(){
  var b=$('fam'),on=lists(); b.setAttribute('aria-pressed',on?'true':'false'); b.textContent='Family lists: '+(on?'on':'off');
}
function inFam(c,t){ var f=famOf(c),k; if(!f)return null;
  for(k=0;k<f.length;k++){ var r=f[k]; if(r.t&&t>=r.t[0]&&(r.t[1]==null||t<r.t[1]-0.25)) return r; } return null; }
function famCheck(){   // from timeupdate and its own timer: at a family list, say so and go on after it
  clearTimeout(famT); var c=list[i];
  if(!want||busy||N.busy||mode!=='audio'||audio.paused||!c)return;
  var r=inFam(c,audio.currentTime);
  if(r){ skipOver(c,r); return; }
  var f=famOf(c),t=audio.currentTime,k; if(!f)return;
  for(k=0;k<f.length;k++) if(f[k].t&&f[k].t[0]>t){ famT=setTimeout(famCheck,Math.max(20,(f[k].t[0]-t)/rate()*1000)); break; }
}
function skipOver(c,r){
  N.to=r.t[1]; N.from=r.t[0]; audio.pause(); hint(); $('sub').textContent=r.say.replace(/\.$/,'');
  say(r,function(){
    if(list[i]!==c)return; $('sub').textContent=place(c);
    if(r.t[1]==null||r.t[1]>=audio.duration-0.3){ ended(); return; }
    audio.currentTime=r.t[1]; if(want) audio.play().catch(function(){want=false;setIcon();});
  });
}
function noticeStop(){   // pause pressed while a notice is said: stop there, just after the family list
  var c=list[i]; hush(); if(c) $('sub').textContent=place(c);
  if(N.whole){ N.whole=false; return; }
  if(N.to==null) return; if(isFinite(audio.duration)&&N.to<audio.duration-0.3) audio.currentTime=N.to;
}
function skipWhole(c){   // a chapter that is a family list from start to end
  N.whole=true; hint(); $('sub').textContent='A list of family names, skipped';
  say(c.familyAll,function(){ N.whole=false; if(list[i]!==c)return; $('sub').textContent=place(c);
    if(stopAtEnd){ stopAtEnd=false; $('sleep').value='0'; want=false; setIcon(); return; }
    var k=i+1; if(k<list.length) load(k,true); else { want=false; setIcon(); $('sub').textContent='You are all caught up'; } });
}
function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x}
function rate(){return parseFloat($('rate').value)||1}
function name(c){return c.title||c.book+' '+c.chapter}
function place(c){return c.sub||'Chapter '+c.chapter+' of '+c.total}
function setIcon(){ $('ico').innerHTML=want?PAUSE:PLAY; $('play').setAttribute('aria-label',want?'Pause':'Play'); }
function paint(cur,dur){
  seek.max=dur||100; if(!dragging) seek.value=cur;
  seek.style.setProperty('--p',(dur?Math.min(100,(dragging?seek.value:cur)/dur*100):0)+'%');
  var shown=dragging?parseFloat(seek.value):cur;
  if(mode==='audio'){ $('tcur').textContent=fmt(shown); $('trem').textContent=dur?'-'+fmt((dur-shown)/rate()):'0:00'; }
  else { $('tcur').textContent='Part '+Math.min(sents.length,Math.floor(shown)+1); $('trem').textContent='of '+sents.length; }
}
function savePos(force){
  if(mode!=='audio'||!list[i])return; var now=Date.now(); if(!force&&now-lastSave<4000)return; lastSave=now;
  if(audio.currentTime>3&&(!audio.duration||audio.currentTime<audio.duration-3)) pos[list[i].id]=Math.floor(audio.currentTime); else delete pos[list[i].id];
  put('listenPos',pos); spot();
}
function spot(){ var c=list[i]; if(c) put('lastSpot',{mode:'listen',id:c.id,url:c.url,label:name(c),t:pos[c.id]||0,at:Date.now()}); }
function meta(){
  var c=list[i]; if(!('mediaSession' in navigator))return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:name(c),artist:'The Bible, Freshly Translated',album:c.book});}catch(e){}
}
function posState(){
  if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState||mode!=='audio'||!isFinite(audio.duration))return;
  try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)});}catch(e){}
}
function rows(){
  var c=list[i],slug=$('book').value,h='';
  list.forEach(function(x,k){ if(x.slug!==slug)return;
    var p=pos[x.id]&&x.duration?Math.min(100,pos[x.id]/x.duration*100):0;
    h+='<li><button data-k="'+k+'" class="'+(k===i?'cur':(done[x.id]?'done':''))+'"><span class="ix">'+x.chapter+'</span><span class="nm">'+name(x)+
       (p&&k!==i?'<span class="bar"><i style="width:'+p+'%"></i></span>':'')+'</span><span class="du">'+(x.audio?(x.duration?fmt(x.duration):''):'phone voice')+'</span></button></li>';
  });
  $('rows').innerHTML=h;
}
function show(){
  var c=list[i]; $('title').textContent=name(c); $('read').href='../'+c.url+(c.audio?'#listen-read':''); $('read').textContent=c.audio?'Listen + Read':'Read along';
  $('prev').disabled=false; $('next').disabled=i>=list.length-1;
  if($('book').value!==c.slug) $('book').value=c.slug;
  var n=$('note');
  if(wholeSkip(c)){n.hidden=false;n.textContent='This chapter is a list of family names, so it is skipped. Turn on Family lists to hear it.';$('sub').textContent=place(c);}
  else if(c.audio){n.hidden=true;$('sub').textContent=place(c);}
  else{n.hidden=false;n.textContent='No recording for this chapter yet, so your phone’s own voice reads it. Keep the screen on while it plays.';$('sub').textContent='Recording coming soon';}
  rows(); meta(); put('listenAt',c.id); spot();
}
function stopAll(){ audio.pause(); if(synth)synth.cancel(); }
function speakNext(){
  if(!want||mode!=='tts')return;
  if(si>=sents.length){ended();return;}
  var u=new SpeechSynthesisUtterance(sents[si]);u.rate=rate();var mine=si;
  u.onend=function(){ if(mode!=='tts'||si!==mine||!want)return; si++; paint(si,sents.length); speakNext(); };
  u.onstart=function(){ fails=0; };
  u.onerror=function(e){ if(e.error==='interrupted'||e.error==='canceled'||si!==mine)return;
    if(++fails>=3){ want=false; setIcon(); $('note').hidden=false; $('note').textContent='This phone could not read the chapter aloud. A recording will be added soon.'; return; }
    si++; speakNext(); };
  synth.speak(u);
}
function load(k,auto){
  busy=true; stopAll(); hush(); clearTimeout(famT); i=k; var c=list[i]; want=!!auto; setIcon(); show();
  if(wholeSkip(c)){   // said, not played: the next chapter follows (it is loaded only once it is reached)
    mode='audio'; busy=false; audio.removeAttribute('src'); seek.disabled=true; paint(0,0); $('tcur').textContent='0:00'; $('trem').textContent='';
    if(want) skipWhole(c); return;
  }
  if(c.audio){
    mode='audio'; seek.disabled=false; seek.step=0.1; paint(0,c.duration||0);
    var resume=pos[c.id]||0; seek.disabled=true; $('sub').textContent='Loading\u2026';
    // The whole recording is downloaded first and played from memory. The site's host does not
    // answer partial-file requests, and without them the browser cannot jump ahead in a file.
    whole(c).then(function(src){
      if(list[i]!==c)return;
      audio.defaultPlaybackRate=rate(); audio.src=src; audio.playbackRate=rate();
      audio.addEventListener('loadedmetadata',function once(){ audio.removeEventListener('loadedmetadata',once);
        busy=false; seek.disabled=false; $('sub').textContent=place(c);
        if(resume&&resume<audio.duration-5){ audio.currentTime=resume; if(!want){ $('note').hidden=false; $('note').textContent='Back where you left off, at '+fmt(resume)+'. Press play to carry on.'; } }
        paint(audio.currentTime,audio.duration); posState();
        if(list[i+1]&&list[i+1].audio) whole(list[i+1]); });
      audio.load(); if(want) audio.play().catch(function(){want=false;setIcon();});
    });
  }else{
    mode='tts'; busy=false; audio.removeAttribute('src'); sents=[]; si=0; seek.step=1; paint(0,1);
    if(!synth){ $('note').textContent='No recording for this chapter yet, and this browser cannot read aloud.'; seek.disabled=true; return; }
    fetch('../'+c.text).then(function(r){return r.text()}).then(function(t){
      if(list[i]!==c)return; sents=t.match(/[^.!?;:]+[.!?;:]*["”’')]*\s*/g)||[t]; paint(0,sents.length); if(want)speakNext(); });
  }
}
var blobs={},order=[];
function whole(c){
  if(c.stream)return Promise.resolve('../'+c.audio);   // a long recording (the Quran in Arabic): played straight from the server
  if(blobs[c.id])return blobs[c.id];
  var pr=fetch('../'+c.audio).then(function(r){ if(!r.ok)throw 0; return r.blob(); })
    .then(function(b){ return URL.createObjectURL(b); })
    .catch(function(){ delete blobs[c.id]; return '../'+c.audio; });
  blobs[c.id]=pr; order.push(c.id);
  while(order.length>4){ var old=order.shift(); if(list[i]&&old===list[i].id){ order.push(old); break; }
    (function(q){ if(q) q.then(function(u){ if(u.indexOf('blob:')===0) URL.revokeObjectURL(u); }); })(blobs[old]); delete blobs[old]; }
  return pr;
}
function ended(){
  var c=list[i]; done[c.id]=1; put('listenDone',done); delete pos[c.id]; put('listenPos',pos);
  if(stopAtEnd){ stopAtEnd=false; $('sleep').value='0'; want=false; setIcon(); rows(); return; }
  if(i+1<list.length) load(i+1,true); else { want=false; setIcon(); rows(); $('sub').textContent='You are all caught up'; }
}
function play(){ unlock(); want=true; setIcon(); var c=list[i];
  if(wholeSkip(c)){ if(!N.busy) skipWhole(c); return; }
  if(mode==='audio'&&c&&c.audio) $('note').hidden=true;
  if(mode==='audio'){ if(busy)return; if(N.busy) return; audio.playbackRate=rate(); audio.play().catch(function(){want=false;setIcon();}); } else speakNext(); }
function pause(){ want=false; setIcon(); if(N.busy){ noticeStop(); savePos(true); rows(); return; } if(mode==='audio'){ if(busy)return; audio.pause(); savePos(true); } else if(synth) synth.cancel(); }
function toggle(){ want?pause():play(); }
function seekBy(d){
  if(mode==='audio'){ if(!isFinite(audio.duration))return; if(N.busy){ noticeStop(); }
    var to=Math.max(0,Math.min(audio.duration-0.2,audio.currentTime+d)),r=inFam(list[i],to);
    if(r) to=d<0?Math.max(0,r.t[0]-5):(r.t[1]==null?audio.duration-0.2:r.t[1]);   // over a family list, not into it
    audio.currentTime=to; paint(audio.currentTime,audio.duration); posState(); savePos(true); famCheck(); }
  else if(sents.length){ si=Math.max(0,Math.min(sents.length-1,si+(d<0?-1:1))); synth.cancel(); paint(si,sents.length); if(want) setTimeout(speakNext,80); }
}
function next(){ if(i+1<list.length){ savePos(true); load(i+1,want||N.busy); } }
function prev(){
  if(mode==='audio'&&audio.currentTime>5){ audio.currentTime=0; paint(0,audio.duration); posState(); return; }
  if(mode==='tts'&&si>1){ si=0; synth.cancel(); paint(0,sents.length); if(want) setTimeout(speakNext,80); return; }
  var k=i-1; while(k>0&&wholeSkip(list[k])) k--;   // back past a chapter that is only a family list
  if(k>=0){ delete pos[list[k].id]; load(k,want||N.busy); }
}
audio.addEventListener('timeupdate',function(){ if(mode!=='audio')return; paint(audio.currentTime,audio.duration); savePos(false); famCheck(); });
audio.addEventListener('seeked',famCheck); audio.addEventListener('ratechange',famCheck);
audio.addEventListener('durationchange',function(){ if(mode==='audio'){ paint(audio.currentTime,audio.duration); posState(); } });
audio.addEventListener('ended',function(){ if(mode==='audio') ended(); });
audio.addEventListener('play',function(){ if(N.busy){ audio.pause(); return; } want=true; setIcon(); posState(); famCheck(); });
audio.addEventListener('pause',function(){ if(N.busy)return; if(!busy&&mode==='audio'&&!audio.ended&&audio.readyState>0&&!audio.seeking){ want=false; setIcon(); savePos(true); rows(); } });
audio.addEventListener('ratechange',posState);
audio.addEventListener('error',function(){ if(mode==='audio'&&audio.getAttribute('src')){ want=false; setIcon(); $('note').hidden=false; $('note').textContent='This recording could not be loaded. Check your connection and press play again.'; } });
seek.addEventListener('input',function(){ dragging=true; paint(mode==='audio'?audio.currentTime:si,mode==='audio'?audio.duration:sents.length); });
seek.addEventListener('change',function(){ var v=parseFloat(seek.value); dragging=false;
  if(mode==='audio'){ if(isFinite(audio.duration)){ if(N.busy) noticeStop(); var r=inFam(list[i],v); if(r) v=r.t[1]==null?audio.duration-0.2:r.t[1];
    audio.currentTime=Math.min(v,audio.duration-0.2); posState(); savePos(true); } }
  else if(sents.length){ si=Math.min(sents.length-1,Math.floor(v)); synth.cancel(); paint(si,sents.length); if(want) setTimeout(speakNext,80); } });
$('play').onclick=toggle; $('back').onclick=function(){seekBy(-15)}; $('fwd').onclick=function(){seekBy(30)}; $('next').onclick=next; $('prev').onclick=prev;
$('rate').onchange=function(){ put('listenRate',$('rate').value); audio.defaultPlaybackRate=rate(); audio.playbackRate=rate(); paint(audio.currentTime,audio.duration);
  if(mode==='tts'&&want){ synth.cancel(); setTimeout(speakNext,80); } };
$('sleep').onchange=function(){ clearTimeout(sleepT); stopAtEnd=false; var v=$('sleep').value;
  if(v==='end') stopAtEnd=true; else if(+v) sleepT=setTimeout(function(){ pause(); $('sleep').value='0'; },+v*60000); };
$('book').onchange=rows;
$('fam').onclick=function(){
  put('familyLists',!lists()); famBtn(); var c=list[i]; if(!c)return;
  if(lists()&&N.busy){   // turned on while a notice is said: play what it was skipping
    var whole=N.whole,from=N.from; hush(); N.whole=false;
    if(whole){ load(i,true); return; }
    $('sub').textContent=place(c); if(from!=null) audio.currentTime=from; audio.play().catch(function(){want=false;setIcon();}); return; }
  if(c.familyAll){ load(i,want); return; }   // the chapter on screen is a family list: show it as it now plays
  famCheck();
};
$('rows').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; savePos(true); load(+b.dataset.k,true); window.scrollTo({top:0,behavior:'smooth'}); });
document.addEventListener('keydown',function(e){ if(/SELECT|INPUT|BUTTON|A/.test(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();toggle();} else if(e.key==='ArrowLeft')seekBy(-15); else if(e.key==='ArrowRight')seekBy(30); });
document.addEventListener('visibilitychange',function(){ if(document.hidden) savePos(true); });
window.addEventListener('pagehide',function(){ savePos(true); });
if('mediaSession' in navigator){
  var ms=navigator.mediaSession,set=function(a,f){try{ms.setActionHandler(a,f)}catch(e){}};
  set('play',play); set('pause',pause); set('previoustrack',prev); set('nexttrack',next);
  set('seekbackward',function(d){seekBy(-(d&&d.seekOffset||15))}); set('seekforward',function(d){seekBy(d&&d.seekOffset||30)});
  set('seekto',function(d){ if(mode==='audio'&&d&&isFinite(d.seekTime)){ audio.currentTime=d.seekTime; posState(); } });
}
fetch('../manifest.json').then(function(r){return r.json()}).then(function(m){
  list=m; if(!list.length){ $('title').textContent='Nothing yet'; return; }
  var seen={},opts=''; list.forEach(function(c){ if(!seen[c.slug]){ seen[c.slug]=1; opts+='<option value="'+c.slug+'">'+c.book+'</option>'; } });
  $('book').innerHTML=opts; $('book').hidden=Object.keys(seen).length<2;   // one list only (the Quran's surahs): no picker
  var r=get('listenRate',null); if(r) $('rate').value=r;
  if(list.some(function(c){ return c.family||c.familyAll; })){ $('fam').hidden=false; famBtn(); }
  var from=new URLSearchParams(location.search).get('from')||get('listenAt',null),k=0;
  list.forEach(function(c,n){ if(c.id===from) k=n; });
  load(k,false);
});
})();
</script>
