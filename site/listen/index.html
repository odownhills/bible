<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#171223">
<title>Listen</title>
<style>
:root{--bg:#171223;--panel:#1E1830;--shade:#241C3A;--text:#E8E2F2;--text-soft:#B3A7C9;--heading:#C9B8EC;--rule:#372C52;--accent:#B79BE8;--num:#7A6A9A;--alt-text:#C4B4E2;--note-bg:#201A32;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman",Times,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:19px;line-height:1.75}
a{color:var(--accent)}
.wrap{max-width:42rem;margin:0 auto;padding:1.25rem 16px 4rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding-bottom:.75rem;border-bottom:1px solid var(--rule);margin-bottom:1.5rem}
.top a{text-decoration:none;color:var(--text-soft)}
.top a:hover{color:var(--accent)}
h1{font-family:var(--serif);color:var(--heading);font-weight:normal;font-size:2rem;line-height:1.25;margin:.5rem 0 .25rem}
.sub{font-family:var(--sans);color:var(--text-soft);font-size:.85rem;margin:0 0 1.75rem}
h2.sec{font-family:var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;font-weight:600;line-height:1.4;border-bottom:1px solid var(--rule);padding-bottom:.4rem;margin:2.25rem 0 1rem}
h3.group{font-family:var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:.4rem;margin:2rem 0 1rem}
p.v{margin:0 0 1.1rem}
p.title{font-style:italic;color:var(--text-soft);margin:0 0 1rem}
sup.n{font-family:var(--sans);font-size:.6em;color:var(--num);user-select:none;-webkit-user-select:none;margin:0 .2em 0 .1em;vertical-align:super;line-height:0}
.alt{font-style:italic;font-size:.88em;color:var(--alt-text)}
.note{font-style:italic;font-size:.85em;color:var(--text-soft);background:var(--note-bg);border-radius:4px;padding:0 .3em}
.numbering{font-family:var(--sans);font-size:.85rem;color:var(--text-soft);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:.6rem .8rem;margin:0 0 1.5rem}
.pn{display:flex;justify-content:space-between;gap:.75rem;margin-top:3rem;font-family:var(--sans);font-size:.9rem}
.pn a,.pn span{flex:1;display:block;padding:.85rem 1rem;border:1px solid var(--rule);border-radius:10px;background:var(--panel);text-decoration:none}
.pn .next{text-align:right}
.pn span{color:var(--num)}
.btn{display:inline-block;font-family:var(--sans);font-size:.85rem;color:var(--bg);background:var(--accent);border:0;border-radius:999px;padding:.5rem 1rem;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem;font-family:var(--sans);font-size:.95rem}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr))}
.grid a,.grid span{display:block;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--rule);background:var(--panel);text-decoration:none;line-height:1.3}
.grid.ch a,.grid.ch span{text-align:center;padding:.7rem 0}
.grid a{color:var(--text)}
.grid a:hover{border-color:var(--accent)}
.grid span{color:var(--num);background:transparent}
.grid small{display:block;color:var(--text-soft);font-size:.75rem;margin-top:.2rem}
.grid span small{color:var(--num)}
.continue{display:block;margin:0 0 1.5rem;padding:1rem 1.1rem;border-radius:12px;background:var(--shade);border:1px solid var(--rule);text-decoration:none;font-family:var(--sans)}
.continue b{display:block;color:var(--heading);font-family:var(--serif);font-weight:normal;font-size:1.2rem}
.continue small{color:var(--text-soft)}
.continue[hidden]{display:none}
footer{margin-top:3rem;font-family:var(--sans);font-size:.75rem;color:var(--num);text-align:center}
</style></head>
<body><div class="wrap">
<nav class="top"><a href="../">Books</a><a href="../listen/">Listen</a></nav>
<h1>Listen</h1>
<p class="sub">Plays chapter after chapter until you stop it.</p>
<style>
.player{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:1.1rem;font-family:var(--sans)}
.now{color:var(--text-soft);font-size:.8rem;text-transform:uppercase;letter-spacing:.1em}
.now b{display:block;font-family:var(--serif);font-weight:normal;text-transform:none;letter-spacing:0;color:var(--heading);font-size:1.6rem;margin:.2rem 0 .8rem}
.controls{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.controls .btn{font-size:1rem;padding:.65rem 1.1rem}
.player select{width:100%;margin-top:1rem;font:inherit;font-size:.95rem;color:var(--text);background:var(--shade);border:1px solid var(--rule);border-radius:8px;padding:.6rem}
.player label{display:block;margin-top:1rem;font-size:.8rem;color:var(--text-soft)}
.hint{font-family:var(--sans);font-size:.8rem;color:var(--text-soft);margin-top:1rem}
progress{width:100%;margin-top:1rem;accent-color:var(--accent)}
</style>
<div class="player">
  <div class="now">Now playing<b id="title">&hellip;</b></div>
  <div class="controls">
    <button class="btn ghost" id="prev" aria-label="Previous chapter">&#9198;</button>
    <button class="btn" id="play">&#9654; Play</button>
    <button class="btn ghost" id="next" aria-label="Next chapter">&#9197;</button>
    <a class="btn ghost" id="read" href="#">Read</a>
  </div>
  <progress id="prog" value="0" max="1"></progress>
  <label>Start from <select id="pick"></select></label>
  <label>Speed <select id="rate"><option>0.9</option><option selected>1</option><option>1.1</option><option>1.25</option><option>1.5</option></select></label>
  <p class="hint" id="mode"></p>
</div>
<audio id="audio" preload="auto"></audio>
<script>
(function(){
var list=[],i=0,playing=false,sents=[],si=0;
var $=function(id){return document.getElementById(id)};
var audio=$('audio'),synth=window.speechSynthesis;
function save(){try{localStorage.setItem('listenAt',list[i].id)}catch(e){}}
function rate(){return parseFloat($('rate').value)||1}
function show(){
  var c=list[i];if(!c)return;
  $('title').textContent=c.book+' '+c.chapter;$('pick').value=c.id;$('read').href='../'+c.url;
  $('mode').textContent=c.audio?'Recorded voice. Keeps playing with the screen off.':
    'This chapter has no recording yet, so your phone’s built-in voice reads it. Keep the screen on while it plays.';
  if('mediaSession' in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:c.book+' '+c.chapter,artist:'The Bible, Freshly Translated'});}
}
function stopAll(){audio.pause();if(synth)synth.cancel();}
function speakNext(){
  if(!playing)return;
  if(si>=sents.length){advance();return;}
  var u=new SpeechSynthesisUtterance(sents[si]);u.rate=rate();
  u.onend=function(){si++;$('prog').value=si/sents.length;speakNext();};
  u.onerror=function(e){if(e.error!=='interrupted'&&e.error!=='canceled'){si++;speakNext();}};
  synth.speak(u);
}
function start(){
  var c=list[i];stopAll();show();save();$('prog').value=0;
  if(c.audio){audio.src='../'+c.audio;audio.playbackRate=rate();audio.play().catch(function(){});}
  else if(synth){sents=c.text.match(/[^.!?;:]+[.!?;:]*["”’')]*\s*/g)||[c.text];si=0;speakNext();}
}
function advance(){if(i+1<list.length){i++;start();}else{playing=false;$('play').innerHTML='&#9654; Play';$('title').textContent='All caught up';}}
function toggle(){
  playing=!playing;$('play').innerHTML=playing?'&#10074;&#10074; Pause':'&#9654; Play';
  if(!playing){stopAll();return;}
  var c=list[i];
  if(c.audio&&audio.src&&!audio.ended&&audio.currentTime>0){audio.play();}else{start();}
}
audio.addEventListener('ended',function(){if(playing)advance();});
audio.addEventListener('timeupdate',function(){if(audio.duration)$('prog').value=audio.currentTime/audio.duration;});
$('play').onclick=toggle;
$('next').onclick=function(){if(i+1<list.length){i++;playing?start():show();}};
$('prev').onclick=function(){if(i>0){i--;playing?start():show();}};
$('pick').onchange=function(){for(var k=0;k<list.length;k++)if(list[k].id===this.value)i=k;playing?start():(show(),save());};
$('rate').onchange=function(){audio.playbackRate=rate();};
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',function(){if(!playing)toggle();});
  navigator.mediaSession.setActionHandler('pause',function(){if(playing)toggle();});
  navigator.mediaSession.setActionHandler('nexttrack',function(){$('next').onclick();});
  navigator.mediaSession.setActionHandler('previoustrack',function(){$('prev').onclick();});
}
fetch('../manifest.json').then(function(r){return r.json()}).then(function(m){
  list=m;if(!list.length){$('title').textContent='Nothing yet';return;}
  $('pick').innerHTML=list.map(function(c){return '<option value="'+c.id+'">'+c.book+' '+c.chapter+(c.audio?'':' (phone voice)')+'</option>'}).join('');
  var want=new URLSearchParams(location.search).get('from');
  if(!want){try{want=localStorage.getItem('listenAt')}catch(e){}}
  for(var k=0;k<list.length;k++)if(list[k].id===want)i=k;
  show();
});
})();
</script>

<footer>An original translation from the Hebrew and Greek.</footer>
</div></body></html>
