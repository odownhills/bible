<title>Listen</title>
<style>
:root{--bg:#171223;--panel:#1E1830;--shade:#241C3A;--text:#E8E2F2;--text-soft:#B3A7C9;--heading:#C9B8EC;--rule:#372C52;--accent:#B79BE8;--num:#7A6A9A;--alt-text:#C4B4E2;--note-bg:#201A32;
--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Times New Roman",Times,serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--serif);font-size:19px;line-height:1.75}
a{color:var(--accent)}
.wrap{max-width:42rem;margin:0 auto;padding:1.25rem 16px 4rem}
.top{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-family:var(--sans);font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;padding-bottom:.75rem;border-bottom:1px solid var(--rule);margin-bottom:1.5rem}
.top a{text-decoration:none;color:var(--text-soft)}
.top a:hover{color:var(--accent)}
h1{font-family:var(--serif);color:var(--heading);font-weight:normal;font-size:2rem;line-height:1.25;margin:.5rem 0 .25rem}
.sub{font-family:var(--sans);color:var(--text-soft);font-size:.85rem;margin:0 0 1.75rem}
h2.sec{font-family:var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;font-weight:600;line-height:1.4;border-bottom:1px solid var(--rule);padding-bottom:.4rem;margin:2.25rem 0 1rem}
h3.group{font-family:var(--sans);color:var(--accent);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;font-weight:600;border-bottom:1px solid var(--rule);padding-bottom:.4rem;margin:2rem 0 1rem}
p.v{margin:0 0 1.1rem}
p.title{font-style:italic;color:var(--text-soft);margin:0 0 1rem}
sup.n{font-family:var(--sans);font-size:.6em;color:var(--num);user-select:none;-webkit-user-select:none;margin:0 .2em 0 .1em;vertical-align:super;line-height:0}
.alt{font-style:italic;font-size:.88em;color:var(--alt-text)}
.note{font-style:italic;font-size:.85em;color:var(--text-soft);background:var(--note-bg);border-radius:4px;padding:0 .3em}
.numbering{font-family:var(--sans);font-size:.85rem;color:var(--text-soft);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:.6rem .8rem;margin:0 0 1.5rem}
.pn{display:flex;justify-content:space-between;gap:.75rem;margin-top:3rem;font-family:var(--sans);font-size:.9rem}
.pn a,.pn span{flex:1;display:block;padding:.85rem 1rem;border:1px solid var(--rule);border-radius:10px;background:var(--panel);text-decoration:none}
.pn .next{text-align:right}
.pn span{color:var(--num)}
.btn{display:inline-block;font-family:var(--sans);font-size:.85rem;line-height:1.4;color:var(--bg);background:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:.5rem 1rem;text-decoration:none;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.6rem;font-family:var(--sans);font-size:.95rem}
.grid.ch{grid-template-columns:repeat(auto-fill,minmax(3.4rem,1fr))}
.grid a,.grid span{display:block;padding:.7rem .8rem;border-radius:10px;border:1px solid var(--rule);background:var(--panel);text-decoration:none;line-height:1.3}
.grid.ch a,.grid.ch span{text-align:center;padding:.7rem 0}
.grid a{color:var(--text)}
.grid a:hover{border-color:var(--accent)}
.grid span{color:var(--num);background:transparent}
.grid small{display:block;color:var(--text-soft);font-size:.75rem;margin-top:.2rem}
.grid span small{color:var(--num)}
.continue{display:block;margin:0 0 1.5rem;padding:1rem 1.1rem;border-radius:12px;background:var(--shade);border:1px solid var(--rule);text-decoration:none;font-family:var(--sans)}
.continue b{display:block;color:var(--heading);font-family:var(--serif);font-weight:normal;font-size:1.2rem}
.continue small{color:var(--text-soft)}
.continue[hidden]{display:none}
footer{margin-top:3rem;font-family:var(--sans);font-size:.75rem;color:var(--num);text-align:center}
.seek{display:block;width:100%;margin:0;height:28px;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer;touch-action:none}
.seek:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:6px}
.seek::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--accent) var(--p,0%),var(--rule) var(--p,0%))}
.seek::-moz-range-track{height:6px;border-radius:3px;background:var(--rule)}
.seek::-moz-range-progress{height:6px;border-radius:3px;background:var(--accent)}
.seek::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--heading);margin-top:-6px;border:0}
.seek::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--heading);border:0}
.seek:disabled{opacity:.45}
.times{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;color:var(--text-soft);font-variant-numeric:tabular-nums;margin-top:.1rem}
.alt-t{font:inherit;font-size:.78rem;color:var(--accent);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:0 .8rem;min-height:30px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.alt-t:active{background:var(--shade)}
.alt-t:focus-visible{outline:2px solid var(--accent)}
.tb{background:transparent;border:0;color:var(--text);padding:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;cursor:pointer;position:relative;-webkit-tap-highlight-color:transparent}
.tb:active{background:var(--shade)}
.tb:focus-visible{outline:2px solid var(--accent)}
.tb:disabled{color:var(--num);cursor:default}
.tb svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .solid{fill:currentColor;stroke:none}
.tb.skip svg{width:36px;height:36px}
.tb.skip span{position:absolute;font-size:.62rem;font-weight:700;top:50%;left:50%;transform:translate(-50%,-38%);font-variant-numeric:tabular-nums}
.tb.main{width:72px;height:72px;background:var(--accent);color:var(--bg)}
.tb.main:active{background:var(--heading)}
.tb.main svg{width:34px;height:34px}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;justify-content:center}
.chip{font:inherit;font-size:.82rem;color:var(--text);background:var(--shade);border:1px solid var(--rule);border-radius:999px;padding:.5rem .85rem;text-decoration:none;min-height:40px;display:inline-flex;align-items:center;gap:.35rem}
select.chip{-webkit-appearance:none;appearance:none;text-align:center;cursor:pointer}
.chip:focus-visible{outline:2px solid var(--accent)}
body.lr{padding-bottom:10rem}
#ch{position:relative;isolation:isolate}
body.lr #ch p{color:#A396C6}
body.lr #ch .w{color:#A396C6;cursor:pointer;transition:color .4s ease;-webkit-tap-highlight-color:transparent}
body.lr #ch .w.on{color:var(--text)}
body.lr #ch sup.n,body.lr #ch .end{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent}
body.lr #ch sup.n::after,body.lr #ch .end::after{content:"";position:absolute;left:-4px;right:-10px;top:-10px;bottom:-8px}
body.lr #ch .end::after{left:-6px;right:-6px}
body.lr #ch .w.now{color:#fff}
.lr-pill{position:absolute;left:0;top:0;z-index:-1;border-radius:7px;background:rgba(183,155,232,.22);pointer-events:none;opacity:0;transition:transform .26s cubic-bezier(.25,.8,.35,1),width .26s cubic-bezier(.25,.8,.35,1),opacity .3s ease}
body:not(.lr) .lr-pill{display:none}
body.lr #ch .alt,body.lr #ch .note{opacity:.5}
body.lr.noalt #ch .aside,body.lr.noalt #ch sup.n:has(+ .silent){display:none}
@media (prefers-reduced-motion:reduce){body.lr #ch .w,.lr-pill{transition:none}}
.sub .btn{margin:0 .35rem .4rem 0}
.lr-bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--panel);border-top:1px solid var(--rule);font-family:var(--sans);padding:.3rem 14px calc(.5rem + env(safe-area-inset-bottom,0px))}
.lr-bar[hidden]{display:none}
.lr-in{max-width:42rem;margin:0 auto}
.lr-row{display:flex;align-items:center;justify-content:space-between;gap:.25rem;margin-top:.2rem}
.lr-mid{display:flex;align-items:center;gap:.7rem}
.lr-bar .tb{width:46px;height:46px}
.lr-bar .tb.main{width:56px;height:56px}
.lr-bar .tb.main svg{width:28px;height:28px}
.lr-bar .tb.skip svg{width:32px;height:32px}
.lr-bar .tb.x svg{width:22px;height:22px}
.lr-bar .chip{min-height:40px;padding:.35rem .5rem;min-width:4.4rem;justify-content:center}
.lr-msg{font-size:.78rem;color:var(--text-soft);text-align:center;margin:.3rem 0 0}
.lr-msg[hidden]{display:none}
sup.n.here{color:var(--bg);background:var(--accent);border-radius:4px;padding:.15em .35em;transition:all .6s}
.toast{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:30;max-width:30rem;margin:0 auto;background:var(--shade);border:1px solid var(--accent);border-radius:14px;padding:.75rem .9rem;font-family:var(--sans);font-size:.9rem;color:var(--text);box-shadow:0 6px 24px rgba(0,0,0,.45);display:flex;flex-wrap:wrap;align-items:center;gap:.5rem .6rem}
.toast p{margin:0;flex:1 1 100%}
.toast a,.toast button{font:inherit;font-size:.85rem;color:var(--accent);background:transparent;border:1px solid var(--rule);border-radius:999px;padding:.45rem .85rem;text-decoration:none;cursor:pointer;min-height:40px;display:inline-flex;align-items:center}
.toast .x{margin-left:auto;border:0;color:var(--text-soft)}
#ch sup.n{scroll-margin-top:1.5rem}
#ch .w.hit{background:rgba(183,155,232,.3);border-radius:3px;transition:background 1.5s ease}
.top .find{display:inline-flex;align-items:center;padding:.15rem 0}
@media (max-width:400px){.top{gap:.5rem;font-size:.74rem;letter-spacing:.03em}.top span{gap:.8rem!important}.top .lang a,.top .lang b{padding:.1rem .45rem!important}}
@media (max-width:340px){.top span{gap:.5rem!important}.top .lang a,.top .lang b{padding:.1rem .35rem!important}.top .find svg{width:1.05rem;height:1.05rem}}
.top .find svg{width:1.2rem;height:1.2rem;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
body.lr .toast{bottom:calc(10.5rem + env(safe-area-inset-bottom,0px))}
.top span{display:flex;gap:1.4rem}
.btn.tv{background:var(--shade);color:var(--heading);border-color:var(--accent)}
.btn.tv svg{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.4em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style></head>

<nav class="top"><a href="../?home">Books</a><span><a href="../watch/">Watch</a><a href="../listen/">Listen</a><a class="find" href="../search/" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg></a></span></nav>
<style>
.player{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:1.25rem 1.1rem 1.1rem;font-family:var(--sans);margin-top:.5rem}
.np-label{color:var(--text-soft);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;text-align:center}
.np-title{font-family:var(--serif);color:var(--heading);font-size:1.9rem;line-height:1.2;text-align:center;margin:.25rem 0 0}
.np-sub{color:var(--text-soft);font-size:.8rem;text-align:center;min-height:1.3em;margin:.2rem 0 1rem}
.transport{display:flex;align-items:center;justify-content:space-between;margin:1rem 0 .9rem}
.note-line{font-size:.78rem;color:var(--text-soft);text-align:center;margin:.9rem 0 0}
.note-line[hidden]{display:none}
.lib{margin-top:1.75rem;font-family:var(--sans)}
.lib-head{display:flex;justify-content:space-between;align-items:center;gap:.75rem;border-bottom:1px solid var(--rule);padding-bottom:.5rem;margin-bottom:.4rem}
.lib-head h2{font-size:.8rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin:0}
.lib-head select{font:inherit;font-size:.9rem;color:var(--text);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:.45rem .6rem;max-width:60%}
.rows{list-style:none;margin:0;padding:0}
.rows button{width:100%;display:flex;align-items:center;gap:.75rem;background:transparent;border:0;border-bottom:1px solid var(--rule);color:var(--text);font:inherit;font-size:1rem;text-align:left;padding:.85rem .25rem;cursor:pointer;min-height:52px}
.rows button:active{background:var(--panel)}
.rows .ix{width:1.6rem;color:var(--num);font-size:.85rem;text-align:right;font-variant-numeric:tabular-nums;flex:none}
.rows .nm{flex:1;min-width:0}
.rows .du{color:var(--text-soft);font-size:.82rem;font-variant-numeric:tabular-nums;flex:none}
.rows .cur .nm{color:var(--accent);font-weight:600}
.rows .cur .ix{color:var(--accent)}
.rows .done .nm{color:var(--text-soft)}
.rows .bar{display:block;height:3px;border-radius:2px;background:var(--rule);margin-top:.3rem;overflow:hidden}
.rows .bar i{display:block;height:100%;background:var(--accent)}
</style>
<div class="player">
  <div class="np-label">Now playing</div>
  <h1 class="np-title" id="title">&hellip;</h1>
  <p class="np-sub" id="sub"></p>
  <input class="seek" id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Position in chapter">
  <div class="times"><span id="tcur">0:00</span><span id="trem">0:00</span></div>
  <div class="transport">
    <button class="tb" id="prev" aria-label="Previous chapter"><svg viewBox="0 0 24 24"><path class="solid" d="M7 6v12H5V6zM19 6.5v11a.5.5 0 0 1-.8.4L10 12l8.200-5.900a.5.5 0 0 1 .8.400z"/></svg></button>
    <button class="tb skip" id="back" aria-label="Back 15 seconds"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.600-5.900"/><path d="M3.500 3.500v3.500H7"/></svg><span>15</span></button>
    <button class="tb main" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="ico"><path class="solid" d="M8 5.200v13.600a.6.6 0 0 0 .900.500l11-6.800a.6.6 0 0 0 0-1L8.900 4.700a.6.6 0 0 0-.900.500z"/></svg></button>
    <button class="tb skip" id="fwd" aria-label="Forward 30 seconds"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.600-5.900"/><path d="M20.500 3.500v3.500H17"/></svg><span>30</span></button>
    <button class="tb" id="next" aria-label="Next chapter"><svg viewBox="0 0 24 24"><path class="solid" d="M17 6v12h2V6zM5 6.500v11a.5.5 0 0 0 .8.400L14 12 5.800 6.100a.5.5 0 0 0-.8.400z"/></svg></button>
  </div>
  <div class="chips">
    <select class="chip" id="rate" aria-label="Speed">
      <option value="0.8">0.8&times; speed</option><option value="0.9">0.9&times; speed</option><option value="1" selected>1&times; speed</option>
      <option value="1.1">1.1&times; speed</option><option value="1.25">1.25&times; speed</option><option value="1.5">1.5&times; speed</option>
      <option value="1.75">1.75&times; speed</option><option value="2">2&times; speed</option>
    </select>
    <select class="chip" id="sleep" aria-label="Sleep timer">
      <option value="0" selected>Timer off</option><option value="15">Stop in 15 min</option><option value="30">Stop in 30 min</option>
      <option value="60">Stop in 60 min</option><option value="end">Stop after chapter</option>
    </select>
    <a class="chip" id="read" href="#">Read along</a>
  </div>
  <p class="note-line" id="note" hidden></p>
</div>
<div class="lib">
  <div class="lib-head"><h2>Chapters</h2><select id="book" aria-label="Book"></select></div>
  <ul class="rows" id="rows"></ul>
</div>
<audio id="audio" preload="auto"></audio>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var audio=$('audio'),seek=$('seek'),synth=window.speechSynthesis;
var list=[],i=0,busy=false,fails=0,want=false,mode='audio',dragging=false,sents=[],si=0,sleepT=null,stopAtEnd=false,lastSave=0;
var PLAY='<path class="solid" d="M8 5.200v13.600a.6.6 0 0 0 .900.500l11-6.800a.6.6 0 0 0 0-1L8.900 4.700a.6.6 0 0 0-.900.500z"/>';
var PAUSE='<path class="solid" d="M7 5h3.500v14H7zM13.500 5H17v14h-3.500z"/>';
function get(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function put(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var pos=get('listenPos',{}),done=get('listenDone',{});
function fmt(s){if(!isFinite(s)||s<0)s=0;s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+(m<10?'0':''):'')+m+':'+(x<10?'0':'')+x}
function rate(){return parseFloat($('rate').value)||1}
function name(c){return c.title||c.book+' '+c.chapter}
function place(c){return c.sub||'Chapter '+c.chapter+' of '+c.total}
function setIcon(){ $('ico').innerHTML=want?PAUSE:PLAY; $('play').setAttribute('aria-label',want?'Pause':'Play'); }
function paint(cur,dur){
  seek.max=dur||100; if(!dragging) seek.value=cur;
  seek.style.setProperty('--p',(dur?Math.min(100,(dragging?seek.value:cur)/dur*100):0)+'%');
  var shown=dragging?parseFloat(seek.value):cur;
  if(mode==='audio'){ $('tcur').textContent=fmt(shown); $('trem').textContent=dur?'-'+fmt((dur-shown)/rate()):'0:00'; }
  else { $('tcur').textContent='Part '+Math.min(sents.length,Math.floor(shown)+1); $('trem').textContent='of '+sents.length; }
}
function savePos(force){
  if(mode!=='audio'||!list[i])return; var now=Date.now(); if(!force&&now-lastSave<4000)return; lastSave=now;
  if(audio.currentTime>3&&(!audio.duration||audio.currentTime<audio.duration-3)) pos[list[i].id]=Math.floor(audio.currentTime); else delete pos[list[i].id];
  put('listenPos',pos); spot();
}
function spot(){ var c=list[i]; if(c) put('lastSpot',{mode:'listen',id:c.id,url:c.url,label:name(c),t:pos[c.id]||0,at:Date.now()}); }
function meta(){
  var c=list[i]; if(!('mediaSession' in navigator))return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:name(c),artist:'The Bible, Freshly Translated',album:c.book});}catch(e){}
}
function posState(){
  if(!('mediaSession' in navigator)||!navigator.mediaSession.setPositionState||mode!=='audio'||!isFinite(audio.duration))return;
  try{navigator.mediaSession.setPositionState({duration:audio.duration,playbackRate:audio.playbackRate,position:Math.min(audio.currentTime,audio.duration)});}catch(e){}
}
function rows(){
  var c=list[i],slug=$('book').value,h='';
  list.forEach(function(x,k){ if(x.slug!==slug)return;
    var p=pos[x.id]&&x.duration?Math.min(100,pos[x.id]/x.duration*100):0;
    h+='<li><button data-k="'+k+'" class="'+(k===i?'cur':(done[x.id]?'done':''))+'"><span class="ix">'+x.chapter+'</span><span class="nm">'+name(x)+
       (p&&k!==i?'<span class="bar"><i style="width:'+p+'%"></i></span>':'')+'</span><span class="du">'+(x.audio?(x.duration?fmt(x.duration):''):'phone voice')+'</span></button></li>';
  });
  $('rows').innerHTML=h;
}
function show(){
  var c=list[i]; $('title').textContent=name(c); $('read').href='../'+c.url+(c.audio?'#listen-read':''); $('read').textContent=c.audio?'Listen + Read':'Read along';
  $('prev').disabled=false; $('next').disabled=i>=list.length-1;
  if($('book').value!==c.slug) $('book').value=c.slug;
  var n=$('note');
  if(c.audio){n.hidden=true;$('sub').textContent=place(c);}
  else{n.hidden=false;n.textContent='No recording for this chapter yet, so your phone’s own voice reads it. Keep the screen on while it plays.';$('sub').textContent='Recording coming soon';}
  rows(); meta(); put('listenAt',c.id); spot();
}
function stopAll(){ audio.pause(); if(synth)synth.cancel(); }
function speakNext(){
  if(!want||mode!=='tts')return;
  if(si>=sents.length){ended();return;}
  var u=new SpeechSynthesisUtterance(sents[si]);u.rate=rate();var mine=si;
  u.onend=function(){ if(mode!=='tts'||si!==mine||!want)return; si++; paint(si,sents.length); speakNext(); };
  u.onstart=function(){ fails=0; };
  u.onerror=function(e){ if(e.error==='interrupted'||e.error==='canceled'||si!==mine)return;
    if(++fails>=3){ want=false; setIcon(); $('note').hidden=false; $('note').textContent='This phone could not read the chapter aloud. A recording will be added soon.'; return; }
    si++; speakNext(); };
  synth.speak(u);
}
function load(k,auto){
  busy=true; stopAll(); i=k; var c=list[i]; want=!!auto; setIcon(); show();
  if(c.audio){
    mode='audio'; seek.disabled=false; seek.step=0.1; paint(0,c.duration||0);

var blobs={},order=[];
function whole(c){
  if(c.stream)return Promise.resolve('../'+c.audio);   // a long recording (the Quran in Arabic): played straight from the server
  if(blobs[c.id])return blobs[c.id];
  var pr=fetch('../'+c.audio).then(function(r){ if(!r.ok)throw 0; return r.blob(); })
    .then(function(b){ return URL.createObjectURL(b); })

    (function(q){ if(q) q.then(function(u){ if(u.indexOf('blob:')===0) URL.revokeObjectURL(u); }); })(blobs[old]); delete blobs[old]; }
  return pr;
}
function ended(){

  if(i+1<list.length) load(i+1,true); else { want=false; setIcon(); rows(); $('sub').textContent='You are all caught up'; }
}
function play(){ want=true; setIcon(); if(mode==='audio'&&list[i]&&list[i].audio) $('note').hidden=true; if(mode==='audio'){ if(busy)return; audio.playbackRate=rate(); audio.play().catch(function(){want=false;setIcon();}); } else speakNext(); }
function pause(){ want=false; setIcon(); if(mode==='audio'){ if(busy)return; audio.pause(); savePos(true); } else if(synth) synth.cancel(); }
function toggle(){ want?pause():play(); }
function seekBy(d){

  else if(sents.length){ si=Math.max(0,Math.min(sents.length-1,si+(d<0?-1:1))); synth.cancel(); paint(si,sents.length); if(want) setTimeout(speakNext,80); }
}
function next(){ if(i+1<list.length){ savePos(true); load(i+1,want); } }
function prev(){
  if(mode==='audio'&&audio.currentTime>5){ audio.currentTime=0; paint(0,audio.duration); posState(); return; }
  if(mode==='tts'&&si>1){ si=0; synth.cancel(); paint(0,sents.length); if(want) setTimeout(speakNext,80); return; }
  if(i>0){ delete pos[list[i-1].id]; load(i-1,want); }

audio.addEventListener('timeupdate',function(){ if(mode!=='audio')return; paint(audio.currentTime,audio.duration); savePos(false); });
audio.addEventListener('durationchange',function(){ if(mode==='audio'){ paint(audio.currentTime,audio.duration); posState(); } });
audio.addEventListener('ended',function(){ if(mode==='audio') ended(); });
audio.addEventListener('play',function(){ want=true; setIcon(); posState(); });
audio.addEventListener('pause',function(){ if(!busy&&mode==='audio'&&!audio.ended&&audio.readyState>0&&!audio.seeking){ want=false; setIcon(); savePos(true); rows(); } });
audio.addEventListener('ratechange',posState);
audio.addEventListener('error',function(){ if(mode==='audio'&&audio.getAttribute('src')){ want=false; setIcon(); $('note').hidden=false; $('note').textContent='This recording could not be loaded. Check your connection and press play again.'; } });
seek.addEventListener('input',function(){ dragging=true; paint(mode==='audio'?audio.currentTime:si,mode==='audio'?audio.duration:sents.length); });
seek.addEventListener('change',function(){ var v=parseFloat(seek.value); dragging=false;
  if(mode==='audio'){ if(isFinite(audio.duration)){ audio.currentTime=Math.min(v,audio.duration-0.2); posState(); savePos(true); } }
  else if(sents.length){ si=Math.min(sents.length-1,Math.floor(v)); synth.cancel(); paint(si,sents.length); if(want) setTimeout(speakNext,80); } });
$('play').onclick=toggle; $('back').onclick=function(){seekBy(-15)}; $('fwd').onclick=function(){seekBy(30)}; $('next').onclick=next; $('prev').onclick=prev;
$('rate').onchange=function(){ put('listenRate',$('rate').value); audio.defaultPlaybackRate=rate(); audio.playbackRate=rate(); paint(audio.currentTime,audio.duration);
  if(mode==='tts'&&want){ synth.cancel(); setTimeout(speakNext,80); } };
$('sleep').onchange=function(){ clearTimeout(sleepT); stopAtEnd=false; var v=$('sleep').value;
  if(v==='end') stopAtEnd=true; else if(+v) sleepT=setTimeout(function(){ pause(); $('sleep').value='0'; },+v*60000); };
$('book').onchange=rows;
$('rows').addEventListener('click',function(e){ var b=e.target.closest('button'); if(!b)return; savePos(true); load(+b.dataset.k,true); window.scrollTo({top:0,behavior:'smooth'}); });
document.addEventListener('keydown',function(e){ if(/SELECT|INPUT|BUTTON|A/.test(e.target.tagName))return;
  if(e.key===' '){e.preventDefault();toggle();} else if(e.key==='ArrowLeft')seekBy(-15); else if(e.key==='ArrowRight')seekBy(30); });

window.addEventListener('pagehide',function(){ savePos(true); });
if('mediaSession' in navigator){
  var ms=navigator.mediaSession,set=function(a,f){try{ms.setActionHandler(a,f)}catch(e){}};
  set('play',play); set('pause',pause); set('previoustrack',prev); set('nexttrack',next);
  set('seekbackward',function(d){seekBy(-(d&&d.seekOffset||15))}); set('seekforward',function(d){seekBy(d&&d.seekOffset||30)});

}
fetch('../manifest.json').then(function(r){return r.json()}).then(function(m){
  list=m; if(!list.length){ $('title').textContent='Nothing yet'; return; }
  var seen={},opts=''; list.forEach(function(c){ if(!seen[c.slug]){ seen[c.slug]=1; opts+='<option value="'+c.slug+'">'+c.book+'</option>'; } });
  $('book').innerHTML=opts; $('book').hidden=Object.keys(seen).length<2;   // one list only (the Quran's surahs): no picker
  var r=get('listenRate',null); if(r) $('rate').value=r;
  var from=new URLSearchParams(location.search).get('from')||get('listenAt',null),k=0;
  list.forEach(function(c,n){ if(c.id===from) k=n; });
  load(k,false);
});
})();
